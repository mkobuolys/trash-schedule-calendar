name: Sync trash schedule

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the diff without changing the calendar"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium

      - name: Run tests
        run: pytest

      - name: Write config
        env:
          TRASH_CONFIG_YAML: ${{ secrets.TRASH_CONFIG_YAML }}
        run: |
          if [ -n "$TRASH_CONFIG_YAML" ]; then
            printf '%s' "$TRASH_CONFIG_YAML" > config.yaml
            echo "using config from TRASH_CONFIG_YAML secret"
          elif [ -f config.yaml ]; then
            echo "using committed config.yaml"
          else
            echo "::error::no config: set the TRASH_CONFIG_YAML secret or commit config.yaml"
            exit 1
          fi

      - name: Sync calendar
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m trash_calendar.cli --dry-run --verbose
          else
            python -m trash_calendar.cli --verbose
          fi

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-artifacts
          path: |
            screenshots/
            traces/
          if-no-files-found: ignore
          retention-days: 14
