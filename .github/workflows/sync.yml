name: Sync trash schedule

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the diff without changing the calendar"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium

      - name: Write config
        env:
          TRASH_CONFIG_YAML: ${{ secrets.TRASH_CONFIG_YAML }}
        run: |
          if [ -n "$TRASH_CONFIG_YAML" ]; then
            printf '%s' "$TRASH_CONFIG_YAML" > config.yaml
            echo "using config from TRASH_CONFIG_YAML secret"
          elif [ -f config.yaml ]; then
            echo "using committed config.yaml"
          else
            echo "::error::no config: set the TRASH_CONFIG_YAML secret or commit config.yaml"
            exit 1
          fi

      # After writing config.yaml on purpose: test_repo_privacy compares every
      # tracked file against the real values in it, so it only has teeth here.
      - name: Run tests
        run: pytest

      - name: Sync calendar
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        # Deliberately NOT --verbose: on a public repository these logs are
        # world-readable, and debug logging prints the Calendar API URL
        # containing the calendar id. Container ids are redacted by the CLI.
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m trash_calendar.cli --dry-run
          else
            python -m trash_calendar.cli
          fi

      # No artifact upload on purpose. Playwright's screenshot of the provider's
      # results page shows the household address in full, and artifacts on a
      # public repository are downloadable by anyone. Reproduce failures locally
      # with `pytest -m live`, which writes screenshots/ and traces/ on the spot.
