# Copy to config.yaml and fill in your own values.
# config.yaml is gitignored because it contains a home address.
calendar_id: "your-calendar-id@group.calendar.google.com"

timezone: Europe/Vilnius
horizon_months: 6
# Minutes before an all-day event's midnight start.
# 360 = 18:00 the previous evening.
reminder_minutes_before: 360

containers:
  # Ekonovus needs only the container's inventory number.
  - provider: ekonovus
    id: "00-S-00000"

  # Svara additionally needs the address, because its only lookup
  # entry point is the address form.
  - provider: svara
    id: "00-MK-000000"
    location:
      region: "Example r. sav."
      subdistrict: "Example sen."
      city: "Example mstl."
      street: "Example g."
      house: "1-1"
