[project]
name = "trash-feeds"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "icalendar>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["trash_feeds*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real Ekonovus report; excluded by default"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
